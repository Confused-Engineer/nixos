name: System Build

on:
  schedule:
    - cron: '0 5 * * *'    # daily at 05:00
      timezone: 'America/New_York'
  workflow_dispatch:       # also allow manual runs


permissions:
  contents: write
  pull-requests: write

jobs:

  build:
    name: Build ${{ matrix.host }}
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        # One host per distinct closure. The others (controller, dns1/2,
        # music-assist, nixswarm-2/3, terraria) differ from these only in
        # hostname, container units and small config files; the eval job in
        # flake-update.yml covers them, and their packages are cached via these.
        host: [desktop, laptop, g5-5587, kodi, hermes, attic, opencloud, server-template, nixswarm-1]
    steps:

      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install attic client
        run: nix profile install nixpkgs#attic-client

      - name: Authenticate with attic
        env:
          ATTIC_AUTH_TOKEN: "${{ secrets.ATTIC_AUTH_TOKEN }}"
        run: attic login default https://attic.a5f.org "$ATTIC_AUTH_TOKEN"

      - name: Build and push toplevel
        run: |
          sudo sed -i '/^access-tokens/d' /etc/nix/nix.conf
          echo "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}" | sudo tee -a /etc/nix/nix.conf
          # Runners are 4 cores / 8 GB RAM (+4 GB swap). Up to 4 derivations at
          # once, each limited to 1 core: at most ~4 compilers in memory. The
          # default (one job per core, each using every core) ran the runners out
          # of memory on the uncached hermes-agent / Electron builds, and they
          # dropped off with "lost communication".
          TOPLEVEL=$(nix build \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel \
            --print-build-logs \
            --max-jobs 4 \
            --cores 1 \
            --print-out-paths \
            --no-link)
          attic push default:system "$TOPLEVEL"