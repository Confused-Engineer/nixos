name: Runner Cleanup

on:
  schedule:
    - cron: '0 6 * * 0'    # weekly, Sunday at 06:00
  workflow_dispatch:       # also allow manual runs

permissions:
  contents: read

jobs:

  gc:
    name: GC ${{ matrix.runner }}
    # NOTE: these are runner *labels*, not runner names. Each runner must carry
    # its own gitrunner-0N label or the job will queue forever.
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 60
    strategy:
      fail-fast: false     # one runner failing must not cancel the others
      matrix:
        runner: [gitrunner-01, gitrunner-02, gitrunner-03]
    steps:

      - name: Identify runner
        run: |
          echo "matrix target : ${{ matrix.runner }}"
          echo "actual host   : $(hostname)"
          df -h /nix

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix-collect-garbage
        run: |
          GC="$(command -v nix-collect-garbage \
            || echo /nix/var/nix/profiles/default/bin/nix-collect-garbage)"
          sudo "$GC" --delete-older-than 7d

      - name: Report reclaimed space
        run: df -h /nix
